# Render Blueprint: one web service (site + API) and one PostgreSQL database.
# New deploy: Render dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: csb2
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: OPEN_UNIVERSITIES
        value: buet
      - key: DATABASE_URL
        fromDatabase:
          name: csb2-db
          property: connectionString

databases:
  - name: csb2-db
    plan: free
    databaseName: csb2
